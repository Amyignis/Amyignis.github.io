<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tomato Memory 🍅</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe5e5, #ffd6d6);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 32px;
  overflow: hidden;
}

/* MAIN CONTAINER */
.game {
  background: white;
  border-radius: 22px;
  padding: 22px;
  width: 100%;
  max-width: 600px;
  height: 100%;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
}

/* TITLE */
h1 {
  text-align: center;
  margin: 6px 0 14px;
  font-size: 22px;
}

/* SCOREBOARD */
.scoreboard {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 14px;
}

/* GRID */
.grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  padding: 6px 0;
}

/* CARD */
.card {
  aspect-ratio: 1 / 1;
  border-radius: 16px;
  background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
  border: 3px solid #ff4d4d;
  cursor: pointer;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.35s;
}

.card.flipped {
  transform: rotateY(180deg);
}

/* CARD FACES */
.face {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  backface-visibility: hidden;
  border-radius: 13px;
}

.front {
  font-size: 30px;
}

.back {
  transform: rotateY(180deg);
  background: #fff0f0;
  padding: 6px;
}

.back img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 10px;
}

/* BUTTON */
button {
  margin-top: 14px;
  padding: 12px;
  border: none;
  border-radius: 14px;
  background: #ff6b6b;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="game">
  <h1>Tomato Memory 🍅</h1>

  <div class="scoreboard">
    <div>Moves: <span id="moves">0</span></div>
    <div>Time: <span id="time">0</span>s</div>
    <div>Best: <span id="best">—</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <button onclick="restart()">Restart</button>
</div>

<script>
const images = [
  "images/tomato1.png",
  "images/tomato2.png",
  "images/tomato3.png",
  "images/tomato4.png",
  "images/tomato5.png",
  "images/tomato6.png",
  "images/tomato7.png",
  "images/tomato8.png"
];

let flipped = [];
let moves = 0;
let matches = 0;
let time = 0;
let timer = null;

const grid = document.getElementById("grid");
const movesEl = document.getElementById("moves");
const timeEl = document.getElementById("time");
const bestEl = document.getElementById("best");

const bestScore = localStorage.getItem("bestScore");
if (bestScore) bestEl.textContent = bestScore;

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function startTimer() {
  if (timer) return;
  timer = setInterval(() => {
    time++;
    timeEl.textContent = time;
  }, 1000);
}

function createGame() {
  grid.innerHTML = "";
  const cards = shuffle([...images, ...images]);

  cards.forEach(src => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.value = src;

    card.innerHTML = `
      <div class="face front">🍅</div>
      <div class="face back"><img src="${src}"></div>
    `;

    card.onclick = () => flip(card);
    grid.appendChild(card);
  });
}

function flip(card) {
  if (flipped.length === 2 || card.classList.contains("flipped")) return;

  startTimer();
  card.classList.add("flipped");
  flipped.push(card);

  if (flipped.length === 2) {
    moves++;
    movesEl.textContent = moves;

    if (flipped[0].dataset.value === flipped[1].dataset.value) {
      matches++;
      flipped = [];
      if (matches === images.length) endGame();
    } else {
      setTimeout(() => {
        flipped.forEach(c => c.classList.remove("flipped"));
        flipped = [];
      }, 600);
    }
  }
}

function endGame() {
  clearInterval(timer);
  timer = null;

  const best = localStorage.getItem("bestScore");
  if (!best || moves < parseInt(best)) {
    localStorage.setItem("bestScore", moves);
    bestEl.textContent = moves;
    alert("🍅 New best score!");
  } else {
    alert("🍅 You won!");
  }
}

function restart() {
  clearInterval(timer);
  timer = null;
  flipped = [];
  moves = 0;
  matches = 0;
  time = 0;
  movesEl.textContent = 0;
  timeEl.textContent = 0;
  createGame();
}

createGame();
</script>

</body>
</html>
